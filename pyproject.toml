[project]
name = "endursaga"
version = "0.1.0"
description = "An automatic die tester."
readme = "README.md"
authors = [
    { name = "Adam Elnagger", email = "adam.elnagger@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
endursaga = "endursaga:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
